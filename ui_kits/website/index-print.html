<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DreamPath — Print</title>
  <link rel="icon" href="../../assets/logo-dreampath-mark.svg">
  <link rel="stylesheet" href="site.css">
  <style>
    @page { size: A4; margin: 12mm; }
    html, body { background: #fff !important; }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .skip-link { display: none; }
    .print-section-label {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #6b6b76;
      padding: 8mm 0 4mm;
      border-bottom: 1px solid #e6e3da;
      margin-bottom: 8mm;
    }
    .print-page {
      break-before: page;
      page-break-before: always;
    }
    .print-page:first-of-type {
      break-before: auto;
      page-break-before: auto;
    }
    /* Strip interactive overlays that don't make sense on paper */
    [data-screen-label] { break-inside: avoid; }
    section, article, .card, .program-card, .story-card, .partner-card { break-inside: avoid; }
    h1, h2, h3 { break-after: avoid; }
    figure, img, picture, svg { break-inside: avoid; }
    /* Force nav non-sticky in print */
    .site-nav, header, nav { position: static !important; }
    /* Remove animations / transitions */
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
    /* Hide elements that only make sense interactively */
    .lang-switch, button[type="submit"], .apply-cta-floating { /* keep visible — just non-interactive in PDF */ }
    @media print {
      .site-nav, .footer { background: #fff !important; color: #1a1a1a !important; }
    }
  </style>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div id="root"></div>
  <script src="content-store.js"></script>
  <script src="copy.js"></script>
  <script type="text/babel" src="Nav.jsx"></script>
  <script type="text/babel" src="Footer.jsx"></script>
  <script type="text/babel" src="Home.jsx"></script>
  <script type="text/babel" src="About.jsx"></script>
  <script type="text/babel" src="Programs.jsx"></script>
  <script type="text/babel" src="ProgramDetail.jsx"></script>
  <script type="text/babel" src="Apply.jsx"></script>
  <script type="text/babel" src="Pages.jsx"></script>
  <script type="text/babel" src="PrintAll.jsx"></script>
</body>
</html>
